[settings]
minimum_release_age_excludes = ["opencode"]

[settings.github]
use_git_credentials = true

[settings.dotfiles]
root = "~/Workspaces/xqm32/dotfiles"

[settings.python]
compile = false

[settings.ruby]
compile = false

[bootstrap.repos]
"~/Workspaces/xqm32/dotfiles" = { url = "https://github.com/xqm32/dotfiles" }
"~/Workspaces/github/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions" }
"~/Workspaces/github/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting" }
"~/Workspaces/github/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }

[dotfiles]
"~/.config/mise/config.toml" = {}
"~/.zshrc/activate" = { block = "source <(~/.local/bin/mise activate zsh)" }
"~/.zshrc/zsh" = { block = """
HISTSIZE=1000000
SAVEHIST=1000000
setopt INC_APPEND_HISTORY

fpath=(~/Workspaces/github/zsh-completions/src ~/.local/share/zsh/site-functions $fpath)

autoload -Uz compinit
compinit

source ~/Workspaces/github/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
source ~/Workspaces/github/zsh-autosuggestions/zsh-autosuggestions.zsh

source <(starship init zsh)
source <(zoxide init zsh)
source <(fzf --zsh)
""" }
"~/.zprofile/activate" = { block = "source <(~/.local/bin/mise activate zsh --shims)" }
"~/.local/bin" = { mode = "symlink-each" }
"~/Library/Application Support/Code/User/settings.json" = {}

[tools]
aube = "latest"
bun = "latest"
eza = "latest"
fd = "latest"
go = "latest"
"go:golang.org/x/tools/gopls" = "latest"
golangci-lint = "latest"
helix = "latest"
node = "latest"
opencode = "latest"
oxfmt = "latest"
oxlint = "latest"
pitchfork = "latest"
pnpm = "latest"
python = "latest"
rg = "latest"
ruby = "latest"
ruff = "latest"
rust = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
ty = "latest"
uv = "latest"
yq = "latest"
zig = "latest"
zls = "latest"
fzf = "latest"
gh = "latest"
starship = "latest"
zoxide = "latest"
1password-cli = "latest"
usage = "latest"

[env]
_.path = "~/.local/bin"
GOPATH = "{{ env.HOME }}/.local/share/go"
GOBIN = "{{ env.HOME }}/.local/bin"

[shell_alias]
ll = "eza -l"
tree = "eza -T"
