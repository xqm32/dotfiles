[bootstrap.macos.dock]
show_recents = false

[bootstrap.repos]
"~/.local/share/dotfiles" = { url = "https://github.com/xqm32/dotfiles" }
"~/.local/share/zsh-completions" = { url = "https://github.com/zsh-users/zsh-completions" }
"~/.local/share/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting" }
"~/.local/share/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions" }

[bootstrap.hooks.post-tools]
run = "mise exec -- starship preset plain-text-symbols --force --output ~/.config/starship.toml"
